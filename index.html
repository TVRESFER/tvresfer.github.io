<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV RESFER · Presentación</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#19232f;font:16px system-ui,sans-serif}main{max-width:600px;margin:12vh auto;padding:32px}header{font-size:13px;letter-spacing:.18em;color:#536579;font-weight:700}h1{font-size:38px;letter-spacing:-.04em;margin:20px 0 12px}p{color:#66717e;line-height:1.6}button,.link{display:inline-block;border:0;border-radius:10px;padding:15px 22px;font:inherit;cursor:pointer;text-decoration:none}button{background:#215fe5;color:white;font-weight:600}button:disabled{opacity:.45;cursor:default}a{color:#215fe5}label{display:block;margin:28px 0}input{width:80px;padding:9px;border:1px solid #cbd3dd;border-radius:7px;font:inherit}small{display:block;margin-top:22px;color:#66717e}.secondary{margin-top:24px}#stage{position:fixed;inset:0;background:#000;z-index:10}#stage[hidden],section[hidden]{display:none}#slide{width:100%;height:100%;object-fit:contain}#exit{position:absolute;right:20px;top:20px;background:#222b;color:white;opacity:0;transition:opacity .2s}#stage:hover #exit,#exit:focus-visible{opacity:1}#gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}#gallery img{width:100%;height:100px;object-fit:contain;background:#e8ecf1;border-radius:6px}#message{min-height:26px}a:focus-visible,button:focus-visible{outline:3px solid #f29e27;outline-offset:4px}@media(max-width:600px){main{margin:5vh auto;padding:24px}h1{font-size:32px}}

main{max-width:960px;margin:0 auto;padding:32px;min-height:100svh;display:flex;align-items:center;justify-content:center}#home{text-align:center;width:100%}.brand{font-size:clamp(64px,16vw,168px);font-weight:900;letter-spacing:-.055em;line-height:1.1;margin:0 0 48px;background:linear-gradient(to bottom,#aa151b 0%,#aa151b 25%,#f1bf00 25%,#f1bf00 75%,#aa151b 75%,#aa151b 100%);background-clip:text;-webkit-background-clip:text;color:transparent}#home label{margin:0 0 24px;color:#53606e}#home input{margin-left:10px;text-align:center;background:white}#home button{background:#aa151b;padding:16px 28px}#admin{width:100%;max-width:600px;padding:32px 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}#message.sr-only{min-height:0}@media(max-width:600px){main{margin:0 auto;padding:24px}.brand{margin-bottom:36px}}

[hidden]{display:none!important}#admin label{margin:16px 0 8px}.login-row{display:flex;gap:10px}.login-row input{width:100%;min-width:0}#login{padding:20px;background:white;border:1px solid #dde2e8;border-radius:12px}#admin small{margin-top:12px;line-height:1.6}details{margin-top:18px;color:#53606e;font-size:14px;line-height:1.7}summary{cursor:pointer}details ol{padding-left:20px}#manager{margin-top:24px}.admin-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.quiet{background:#e8ecf1;color:#33445a;padding:9px 14px;font-size:14px}#dropzone{display:block;border:2px dashed #b9c7d9;border-radius:12px;background:white;padding:30px 18px;text-align:center;cursor:pointer;color:#215fe5;font-weight:600}#dropzone span{display:block;margin-top:8px;font-size:14px;font-weight:400;color:#66717e}#dropzone.dragging{border-color:#215fe5;background:#eef3ff}#dropzone[aria-disabled="true"]{opacity:.5;pointer-events:none}#gallery{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.image-card{background:white;border:1px solid #dde2e8;border-radius:10px;padding:10px;overflow:hidden}.image-card img{height:120px!important}.image-name{font-size:12px;color:#66717e;overflow-wrap:anywhere;margin:10px 0}.remove{width:100%;padding:9px;background:#fff0f0;color:#aa151b;font-size:14px}#admin-status{min-height:24px;color:#33445a}#admin-status.error{color:#aa151b}#admin-status.success{color:#167345}#gallery:empty:after{content:'Todavía no hay imágenes.';color:#66717e;font-size:14px;grid-column:1/-1}@media(max-width:460px){.login-row{flex-direction:column}}
</style>
<main><section id="home"><h1 class="brand">RESFER</h1><label>Segundos por imagen <input id="seconds" type="number" min="1" max="3600" value="8"></label><button id="start" disabled>▶ Iniciar presentación</button><div class="secondary"><a href="https://resfer-admin.tvresfer.workers.dev/">Administrar imágenes</a></div><p id="message" role="status" class="sr-only">Cargando imágenes…</p></section>
<section id="admin" hidden><p><a href="https://resfer-admin.tvresfer.workers.dev/">Abrir administración</a></p></section></main>
<div id="stage" hidden><img id="slide" alt="Imagen de la presentación"><button id="exit">Salir de la presentación</button></div>
<script>
'use strict';
const $=id=>document.getElementById(id);let images=[],position=0,timer=null,running=false,failed=0;
const endpoint='https://api.github.com/repos/TVRESFER/tvresfer.github.io/contents/imagenes?ref=main';
function route(){if(location.hash==='#administrar'){location.replace('https://resfer-admin.tvresfer.workers.dev/');}}
addEventListener('hashchange',route);route();
async function load(){try{const res=await fetch(endpoint,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!res.ok)throw Error('No se pudieron cargar las imágenes. Recarga la página en unos minutos.');const files=await res.json();images=files.filter(f=>f.type==='file'&&/\.(jpe?g|png|webp|gif|avif)$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name,'es',{numeric:true})).map(f=>({name:f.name,url:f.download_url}));$('message').textContent=images.length?`${images.length} imágenes listas para reproducir.`:'Todavía no hay imágenes.';$('start').disabled=!images.length;}catch(e){$('message').textContent=e.message;}}
function schedule(){clearTimeout(timer);if(running)timer=setTimeout(()=>show(position+1),Math.max(1,Math.min(3600,Number($('seconds').value)||8))*1000);}
function show(index){if(!running||!images.length)return;position=(index+images.length)%images.length;$('slide').src=images[position].url;$('slide').alt=images[position].name;schedule();}
async function stop(){running=false;clearTimeout(timer);$('stage').hidden=true;$('slide').removeAttribute('src');if(document.fullscreenElement)await document.exitFullscreen().catch(()=>{});$('start').focus();}
$('start').onclick=()=>{if(!images.length)return;running=true;failed=0;$('stage').hidden=false;show(0);$('stage').requestFullscreen?.().catch(()=>{});$('exit').focus();};
$('exit').onclick=stop;
$('slide').onload=()=>{failed=0;};$('slide').onerror=()=>{if(!running)return;if(++failed>=images.length){stop();$('message').textContent='No se pudo mostrar ninguna imagen. Revisa los archivos o la conexión.';}else show(position+1);};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&running)stop();});
document.addEventListener('keydown',e=>{if(!running)return;if(e.key==='Escape')stop();if(e.key==='ArrowRight'){e.preventDefault();show(position+1);}if(e.key==='ArrowLeft'){e.preventDefault();show(position-1);}});
load();
</script></html>
